name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Secrets & Build with Vite
        env:
          VITE_MOFFY_API_KEY: ${{ secrets.VITE_MOFFY_API_KEY || secrets.MOFFY_API_KEY || secrets.API_KEY }}
          VITE_MOFFY_API_BASE_URL: ${{ secrets.VITE_MOFFY_API_BASE_URL }}
        run: |
          if [ -z "$VITE_MOFFY_API_KEY" ]; then
            echo "::warning::VITE_MOFFY_API_KEY is not set in Secrets! API will fail in production unless configured."
          else
            echo "VITE_MOFFY_API_KEY is configured (length: ${#VITE_MOFFY_API_KEY})"
          fi
          npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
